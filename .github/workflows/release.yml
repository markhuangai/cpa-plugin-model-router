name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish or refresh, for example v0.1.0.
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: docker-runner
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go vet ./...

  build:
    name: cross-build release assets
    needs: test
    runs-on: rootless-docker
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      XGO_IMAGE: ghcr.io/techknowlogick/xgo@sha256:b00957d8fec512c4748a5fafe17197be1d8c0bf704b271fc4aa128f5ddf40414
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Cross-compile native libraries
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/raw
          go run src.techknowlogick.com/xgo@v1.9.0 \
            -image "$XGO_IMAGE" \
            -targets 'linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,windows/amd64' \
            -buildmode c-shared \
            -trimpath \
            -buildvcs=false \
            -ldflags "-s -w -X main.pluginVersion=$VERSION" \
            -hooksdir .github/xgo \
            -out model-router \
            -dest dist/raw \
            .
      - name: Package and validate release assets
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            'linux|amd64|dist/raw/model-router-linux-amd64.so|so'
            'linux|arm64|dist/raw/model-router-linux-arm64.so|so'
            'darwin|amd64|dist/raw/model-router-darwin-*-amd64.dylib|dylib'
            'darwin|arm64|dist/raw/model-router-darwin-*-arm64.dylib|dylib'
            'windows|amd64|dist/raw/model-router-windows-*-amd64.dll|dll'
          )

          for target in "${targets[@]}"; do
            IFS='|' read -r goos goarch pattern extension <<< "$target"
            mapfile -t matches < <(compgen -G "$pattern" || true)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "expected one cross-build output for $goos/$goarch, found ${#matches[@]}"
              exit 1
            fi

            source_library="${matches[0]}"
            build_metadata="$(go version -m "$source_library")"
            grep -Fq $'\tbuild\tGOOS='"$goos" <<< "$build_metadata"
            grep -Fq $'\tbuild\tGOARCH='"$goarch" <<< "$build_metadata"

            package_dir="dist/package-${goos}-${goarch}"
            mkdir -p "$package_dir"
            cp "$source_library" "$package_dir/model-router.$extension"
          done

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env VERSION \
            --env PLUGIN_ID=model-router \
            --mount "type=bind,source=$PWD/dist,target=/dist" \
            --entrypoint bash \
            "$XGO_IMAGE" \
            -lc '
              set -euo pipefail
              for package_dir in /dist/package-*; do
                target="${package_dir##*/package-}"
                goos="${target%-*}"
                goarch="${target##*-}"
                case "$goos" in
                  windows) extension=dll ;;
                  darwin) extension=dylib ;;
                  *) extension=so ;;
                esac
                library="$PLUGIN_ID.$extension"
                archive="/dist/${PLUGIN_ID}_${VERSION}_${goos}_${goarch}.zip"
                (cd "$package_dir" && zip -q "$archive" "$library")
                [[ "$(unzip -Z1 "$archive")" == "$library" ]]
              done
              cd /dist
              sha256sum "${PLUGIN_ID}"_*.zip > checksums.txt
            '

          mapfile -t archives < <(find dist -maxdepth 1 -type f -name 'model-router_*.zip' -printf '%f\n' | sort)
          if [[ "${#archives[@]}" -ne 5 ]]; then
            echo "expected five release archives, found ${#archives[@]}"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: docker-runner
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - name: Validate downloaded assets
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          expected=(
            "model-router_${version}_linux_amd64.zip"
            "model-router_${version}_linux_arm64.zip"
            "model-router_${version}_darwin_amd64.zip"
            "model-router_${version}_darwin_arm64.zip"
            "model-router_${version}_windows_amd64.zip"
          )

          cd release-assets
          for archive in "${expected[@]}"; do
            test -f "$archive"
            entries="$(unzip -Z1 "$archive")"
            case "$archive" in
              *_windows_*) [[ "$entries" == 'model-router.dll' ]] ;;
              *_darwin_*) [[ "$entries" == 'model-router.dylib' ]] ;;
              *) [[ "$entries" == 'model-router.so' ]] ;;
            esac
          done
          mapfile -t archives < <(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort)
          [[ "${#archives[@]}" -eq 5 ]]
          sha256sum -c checksums.txt
      - name: Create or update GitHub release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -printf '%p\n' | sort)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --title "$RELEASE_TAG" --generate-notes --verify-tag
          fi
