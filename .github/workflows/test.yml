name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out minimum supported CPA v7.3.9
        uses: actions/checkout@v7
        with:
          repository: router-for-me/CLIProxyAPI
          ref: 61fdfc341b96178a8dcb53f2efc46cbc341d267c
          path: .cpa-source
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - name: Check release scripts
        run: bash -n .github/xgo/*.sh
      - name: Test ORM resolver with Node 24
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            core.info(JSON.stringify({
              event: 'orm.tests.started',
              node: process.version,
              tested_sha: process.env.GITHUB_SHA,
              pr_head: context.payload.pull_request?.head.sha || context.sha,
            }));
            await exec.exec('npm', ['ci']);
            await exec.exec(process.execPath, ['--test', 'tests/orm-runtime.test.mjs']);
      - name: Check workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          orm_lint_dir="$(mktemp -d "$RUNNER_TEMP/orm-actionlint.XXXXXX")"
          cleanup() {
            for orm_file in "$orm_lint_dir/actionlint.tar.gz" "$orm_lint_dir/actionlint"; do
              if [[ -f "$orm_file" ]]; then rm -- "$orm_file"; fi
            done
            rmdir -- "$orm_lint_dir"
            echo "orm.tools.cleanup passed"
          }
          trap cleanup EXIT
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$orm_lint_dir/actionlint.tar.gz"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$orm_lint_dir/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$orm_lint_dir/actionlint.tar.gz" -C "$orm_lint_dir" actionlint
          "$orm_lint_dir/actionlint" \
            .github/workflows/test.yml .github/workflows/maintenance.yml \
            .github/workflows/test-ai.yml .github/workflows/orm-runtime.yml
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Test minimum supported CPA integration
        run: CPA_SOURCE="$GITHUB_WORKSPACE/.cpa-source" go test -tags=integration ./... -count=1
      - name: Build native plugin
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -buildmode=c-shared -o dist/model-router.so .

  windows-sqlite:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
      CC: gcc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify native Windows toolchain and source
        run: |
          git rev-parse HEAD
          go env GOOS GOARCH CGO_ENABLED CC
          gcc --version
      - name: Test Windows SQLite paths and registration
        run: go test ./... -run '^(TestSQLite|TestUsageStoreDataPaths|TestUsageStoreRelativePathPersists|TestABIRegistration|TestLegacy)' -count=1 -v
