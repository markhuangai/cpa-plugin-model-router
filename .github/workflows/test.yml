name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l *.go)"
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build native plugin
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -buildmode=c-shared -o dist/model-router.so .
